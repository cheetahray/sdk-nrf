# prj.conf - nRF52833 PAwR Peripheral (Observer) Configuration
# Clean version without inline comments

CONFIG_BT=y

# Scanning and Peripheral support 
CONFIG_BT_OBSERVER=y
# Peripheral support (automatically enables BT_CONN)
CONFIG_BT_PERIPHERAL=y

# Extended Advertising + Coded PHY support
CONFIG_BT_EXT_ADV=y
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_PHY_CODED=y

# Periodic Advertising Sync (for receiving PAwR)
CONFIG_BT_PER_ADV_SYNC=y
CONFIG_BT_CTLR_SYNC_PERIODIC=y

# Peripheral specific features
CONFIG_BT_CTLR_PRIVACY=y

# Power Management (Peripheral usually battery powered)
CONFIG_PM_DEVICE=y

# Timers and work queues
CONFIG_TIMER=y

# Debugging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# PAwR Response real API support (all nRF chips support this!)
# Required base configuration
CONFIG_BT_PER_ADV=y
CONFIG_BT_CTLR_SYNC_TRANSFER_SENDER=y

# PAwR core functionality
CONFIG_BT_PER_ADV_RSP=y
CONFIG_BT_PER_ADV_SYNC_RSP=y
CONFIG_BT_CTLR_SDC_PAWR_ADV=y

# Advertising data length configuration (fixes compile errors)
# Maximum advertising data length (1650 bytes)
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=1650
# Extended advertising support
CONFIG_BT_CTLR_ADV_EXT=y
# Periodic advertising controller support
CONFIG_BT_CTLR_ADV_PERIODIC=y
# Broadcaster support (BT_CTLR_ADV_DATA_LEN_MAX dependency)
CONFIG_BT_BROADCASTER=y
# Advertising data chain support (allows > 191 bytes)
CONFIG_BT_CTLR_ADV_DATA_CHAIN=y

# PAST (Periodic Advertising Sync Transfer) support (fixes bt_hci_le_past_received_v2 error)
# PAST receiver
CONFIG_BT_PER_ADV_SYNC_TRANSFER_RECEIVER=y
# PAST sender
CONFIG_BT_PER_ADV_SYNC_TRANSFER_SENDER=y
# Controller PAST receiver
CONFIG_BT_CTLR_SYNC_TRANSFER_RECEIVER=y
# Controller PAST base support
# CONFIG_BT_CTLR_SYNC_TRANSFER=y