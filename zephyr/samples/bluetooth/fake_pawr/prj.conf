# prj_central.conf - Central (Broadcaster) 雙模式廣播配置
CONFIG_BT=y
# CONFIG_BT_DEBUG_LOG=y

# 藍牙控制器支援
CONFIG_BT_CTLR=y

# 廣播功能 (Central 必須)
CONFIG_BT_BROADCASTER=y

# 🚀 BLE 5.0 Extended Advertising + Coded PHY 支援
CONFIG_BT_EXT_ADV=y                    # Extended Advertising 支援
CONFIG_BT_CTLR_ADV_EXT=y              # Extended Advertising controller support
CONFIG_BT_CTLR_PHY_CODED=y            # Coded PHY 支援 (nRF5340 cpunet)
# CONFIG_BT_EXT_ADV_MAX_ADV_SET=2        # 支援多組廣播 (Legacy + Extended)
# CONFIG_BT_CTLR_ADV_SET=2              # 支援多組廣播 (Legacy + Extended)

# 週期廣播支援 (Central 用於 PAwR 信標)
CONFIG_BT_PER_ADV=y                    # Periodic Advertising
CONFIG_BT_CTLR_ADV_PERIODIC=y          # 週期廣播控制器支援

# Central 特定功能
# CONFIG_BT_CTLR_TX_PWR_0=y
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y        # 最大發射功率 (+8dBm)
# CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=1650  # 最大廣播數據長度 (Extended)

# RTC 和時間同步 (Central 需要高精度)
CONFIG_COUNTER=y
# CONFIG_COUNTER_RTC=y # RTC 支援

# 干擾避免和適應性傳輸
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_BT_CTLR_ADV_RESERVE_MAX=y      # 預留廣播通道
CONFIG_BT_CTLR_CHAN_SEL_2=y           # 通道選擇演算法 #2

# 定時器和工作隊列
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096  # Central 需要更大堆疊
CONFIG_TIMER=y
# CONFIG_HEAP_MEM_POOL_SIZE=8192           # 增加記憶體池

# 調試 (Central)
CONFIG_LOG=y